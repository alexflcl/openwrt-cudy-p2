name: Build Cudy P2 firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rebuild/p2-firmware-clean
    paths:
      - '.github/workflows/build-cudy-p2-firmware.yml'
      - 'configs/cudy-p2-defconfig'
      - 'scripts/cudy-p2-prepare-vendor-driver.sh'
      - 'scripts/cudy-p2-verify-build.sh'
      - 'package/base-files/files/etc/uci-defaults/99-cudy-p2-defaults'
      - 'package/network/services/luci-app-p2modem/**'
      - 'target/linux/mediatek/base-files/lib/preinit/05_set_preinit_iface'
      - 'target/linux/mediatek/filogic/base-files/etc/board.d/02_network'
      - 'target/linux/mediatek/dts/mt7981b-cudy-p2-v1.dts'
      - 'target/linux/mediatek/image/filogic.mk'

permissions:
  contents: read

concurrency:
  group: cudy-p2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cudy-p2:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare build host
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            fastjar flex gawk gettext gcc-multilib g++-multilib git gperf \
            haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool \
            lrzsz mkisofs msmtp ninja-build p7zip-full patch pkgconf python3 \
            python3-ply python3-docutils python3-pyelftools qemu-utils rsync \
            scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
            vim wget xmlto xxd zlib1g-dev zstd

      - name: Add and install PCIe driver feed
        run: |
          grep -q '^src-git sprdpcie ' feeds.conf.default || \
            echo 'src-git sprdpcie https://github.com/zekica/openwrt-sprd-pcie' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Validate source and patch driver noise
        run: |
          sh ./scripts/cudy-p2-verify-build.sh
          sh ./scripts/cudy-p2-prepare-vendor-driver.sh
          sh ./scripts/cudy-p2-verify-build.sh

      - name: Prepare selected target
        run: |
          cp configs/cudy-p2-defconfig .config
          make defconfig
          grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_p2-v1=y' .config
          grep -qx 'CONFIG_PACKAGE_kmod-sprd-pcie=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-p2modem=y' .config

      - name: Build firmware
        run: |
          make download -j"$(nproc)"
          make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: Verify and collect P2 images
        run: |
          target_dir=bin/targets/mediatek/filogic
          sysupgrade="$(find "$target_dir" -maxdepth 1 -name '*cudy_p2-v1-squashfs-sysupgrade.bin' -print -quit)"
          initramfs="$(find "$target_dir" -maxdepth 1 -name '*cudy_p2-v1-initramfs-kernel.bin' -print -quit)"
          test -n "$sysupgrade"
          test -n "$initramfs"
          grep -q 'kmod-sprd-pcie' "$target_dir"/*cudy_p2-v1.manifest
          grep -q 'luci-app-p2modem' "$target_dir"/*cudy_p2-v1.manifest
          mkdir -p artifacts/firmware
          cp "$sysupgrade" "$initramfs" "$target_dir"/*cudy_p2-v1.manifest "$target_dir"/sha256sums artifacts/firmware/
          cp .config artifacts/firmware/cudy-p2-used.config
          cp build.log artifacts/firmware/build.log
          (cd artifacts/firmware && sha256sum * > SHA256SUMS)

      - name: Upload firmware
        uses: actions/upload-artifact@v5
        with:
          name: cudy-p2-firmware
          path: artifacts/firmware
          if-no-files-found: error
